<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Malavolta Research & Development</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000000;
            color: #d8ccb2;
            font-family: "Oriya MN", "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .home {
            width: 100%;
            max-width: 1400px;
            padding: 50px 30px;
        }

        .logo {
            width: min(700px, 90vw);
            height: auto;
            display: block;
            margin: 0 auto 50px;

            /* Avvicina il bianco del logo all'avorio del sito */
            filter: sepia(15%) saturate(45%) brightness(88%);
        }

        h1 {
            margin: 0;
            font-size: clamp(38px, 6vw, 78px);
            font-weight: normal;
            letter-spacing: 4px;
            line-height: 1.15;
            color: #d8ccb2;
        }

        .subtitle {
            margin-top: 24px;
            margin-bottom: 0;
            font-size: clamp(20px, 2.8vw, 32px);
            letter-spacing: 1px;
            color: #d8ccb2;
            font-weight: normal;
        }
    </style>
</head>

<body>

    <main class="home">

        <img
            src="logo.jpeg"
            alt="Malavolta Research & Development"
            class="logo"
        >

        <h1>
            RESEARCH &amp; DEVELOPMENT
        </h1>

        <p class="subtitle">
            invenzioni e progetti rivoluzionari
        </p>

    </main>

</body>
</html>
