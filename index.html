<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Malavolta Research & Development</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000000;
            color: #cfc2a5;
            font-family: "Oriya MN", "Times New Roman", serif;
            text-align: center;
        }

        .home {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 50px 30px 80px;
        }

        .logo {
            width: min(700px, 90vw);
            height: auto;
            display: block;
            margin: 0 auto 50px;
            filter: sepia(15%) saturate(45%) brightness(88%);
        }

        h1 {
            margin: 0;
            font-size: clamp(38px, 6vw, 78px);
            font-weight: normal;
            letter-spacing: 4px;
            line-height: 1.15;
            color: #cfc2a5;
        }

        .subtitle {
            margin-top: 24px;
            margin-bottom: 70px;
            font-size: clamp(20px, 2.8vw, 32px);
            letter-spacing: 1px;
            color: #cfc2a5;
        }

        /* SCHEDA PRODOTTO */

        .product-slider {
            width: min(850px, 90vw);
            margin: 0 auto;
        }

        .product-link {
            display: block;
            text-decoration: none;
            color: #cfc2a5;
        }

        .product-image {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .product-link:hover .product-image {
            transform: scale(1.02);
        }

        .product-title {
            margin-top: 25px;
            font-size: clamp(24px, 3vw, 38px);
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <main class="home">

        <img
            src="logo.jpeg"
            alt="Malavolta Research & Development"
            class="logo"
        >

        <h1>
            RESEARCH &amp; DEVELOPMENT
        </h1>

        <p class="subtitle">
            invenzioni e progetti rivoluzionari
        </p>


        <!-- PRODOTTO 1 -->

        <section class="product-slider">

            <a href="oblivius-262.html" class="product-link">

                <img
                    src="Oblivius-262.png"
                    alt="Oblivius n°262"
                    class="product-image"
                >

                <div class="product-title">
                    OBLIVIUS N°262
                </div>

            </a>

        </section>

    </main>

</body>
</html>
